<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Lens — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="brand">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8Z"
          />
        </svg>
        <h1>URL Lens Settings</h1>
      </header>

      <form id="settings-form" class="card">
        <label for="backend-url">
          Backend URL
          <span class="hint">Default: <code>http://127.0.0.1:8000</code></span>
        </label>
        <input
          id="backend-url"
          name="backendUrl"
          type="url"
          placeholder="http://127.0.0.1:8000"
          required
          spellcheck="false"
        />

        <label for="timeout-ms">
          Scan timeout (ms)
          <span class="hint">1000–30000. Default: 8000.</span>
        </label>
        <input id="timeout-ms" name="timeoutMs" type="number" min="1000" max="30000" step="500" />

        <label for="protect-mode">
          Links to protect
          <span class="hint">Cross-origin (default) or every http(s) link.</span>
        </label>
        <select id="protect-mode" name="protectMode">
          <option value="cross-origin">Cross-origin links (recommended)</option>
          <option value="all">All links</option>
        </select>

        <div class="actions">
          <button type="submit" class="btn primary">Save</button>
          <span id="status" class="status" role="status"></span>
        </div>

        <p id="permission-note" class="note" hidden>Allow host access so scans can reach this backend.</p>
      </form>

      <section class="card muted-card">
        <h2>Privacy</h2>
        <ul>
          <li>URLs are sent only to your backend (<code>POST /api/analyze</code>) — never opened by the extension.</li>
          <li>No API keys are stored in the extension.</li>
          <li>Only the default backend origin is required; others are optional.</li>
        </ul>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
